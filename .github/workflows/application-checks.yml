name: Application checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/personal-profile-recovery]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: must-erms-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Automated tests
        run: npm test
